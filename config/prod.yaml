env: "prod"
allow_origins:
  - https://eng-net-nn-frontend.vercel.app
http_server:
  address: "domain.com"
  header_timeout: 5s;
  read_timeout: 60s;
  write_timeout: 60s;
  idle_timeout: 120s;
db:
  host: "localhost"
  port: 5436
  username: "ipbuild"
  dbname: "unet"
  sslmode: "disable"
redis:
  username: "ipbuild-unet"
  address: "localhost:6380"
  db: 0
  ttl:
    user_profile: 1h
    auth_timeout: 5m
token:
  access_ttl: 15m
  refresh_ttl: 168h
  cookie:
    name: "refresh_token"
    domain: "domain-api.com"
    path: "/"
    secure: true
    same_site: "none"
smtp:
  host: "smtp.ya.ru"
  port: 465
minio:
  endpoint: "localhost:9000"
  bucket: "unet-resume"
  use_ssl: false
log:
  level: "info"
  add_caller: true
  stacktrace: "error"
